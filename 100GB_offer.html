<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>১০০ জিবি এমবি ফ্রি অফার</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Bengali', sans-serif; background: #111; color: #fff; margin: 0; }
    .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); margin-top: 20px; }
    .btn { background: #00b894; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; transition: background 0.3s; }
    .btn:hover { background: #019875; }
    .hidden { display: none; }
    .task, .comment-section { margin-top: 20px; }
    .comment { display: flex; align-items: center; background: #2c2c2c; padding: 15px; margin: 8px 0; border-radius: 5px; font-size: 16px; }
    .comment img { width: 50px; height: 50px; border-radius: 50%; margin-right: 12px; }
    input[type="text"] { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 5px; border: none; }
    .history-bar-wrapper { background: #6a0dad; padding: 10px; overflow: hidden; }
    .history-bar { display: flex; white-space: nowrap; animation: scroll-left 30s linear infinite; }
    .history-item { background: #1e0c3b; color: #ffc107; padding: 5px 15px; margin-right: 10px; border-radius: 10px; display: flex; align-items: center; font-weight: bold; }
    .history-item span { margin-left: 5px; color: white; }
    @keyframes scroll-left {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .copy-btn { margin-top: 10px; background: #636e72; font-size: 14px; padding: 5px 10px; }
    .visitor-counter { text-align: center; font-size: 14px; color: #aaa; margin-top: 10px; }
    .progress-bar-wrapper { background: #333; border-radius: 5px; overflow: hidden; margin-top: 10px; }
    .progress-bar { background: #00cec9; height: 15px; width: 0%; transition: width 1s; }
    .success-msg { text-align: center; background: #14532d; padding: 10px; margin-top: 10px; border-radius: 8px; color: #b9fbc0; font-size: 18px; font-weight: bold; }
    .firework { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif') center/cover no-repeat; z-index: 9999; display: none; }
  </style>
</head>
<body>

  </script>
</body>
</html>
